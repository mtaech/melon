# dsh-plugin-dashboard bundle patch: inserts the dual-face plugin row into the
# profile roster. The node half (exports ".") registers the /plugins/dsh-plugin-dashboard/api
# routes on the host webserver; the `dsh.client` declaration in package.json
# makes the browser half (exports "./client") load in the web GUI as a
# "版本" tab under Settings → Plugins.
- insert:
    - id: plugin-dashboard
      name: dsh-plugin-dashboard