packages:
  - packages/*

# 这些包的 postinstall 产出平台二进制，缺失会导致运行期失败：
# esbuild/sharp 是构建与截图依赖，@ast-grep/cli 提供 ast-edit 的 ast-grep ELF。
allowBuilds:
  '@ast-grep/cli': true
  esbuild: true
  sharp: true

# 单一版本源：@deepseek-ai/* 必须整体对齐同一个 rc，
# 混用不同 rc 会触发 peer 冲突（cordis 服务实例不同源）。
catalog:
  '@deepseek-ai/cordis': ^4.0.1
  '@deepseek-ai/dsh-api-remotes': ^0.1.1-rc.2
  '@deepseek-ai/dsh-attachment': ^0.1.1-rc.2
  '@deepseek-ai/dsh-client-locale': ^0.1.1-rc.2
  '@deepseek-ai/dsh-client-ui-renderer': ^0.1.1-rc.2
  '@deepseek-ai/dsh-client-ui-settings': ^0.1.1-rc.2
  '@deepseek-ai/dsh-client-ui-slots': ^0.1.1-rc.2
  '@deepseek-ai/dsh-client-ui-theme': ^0.1.1-rc.2
  '@deepseek-ai/dsh-host-webserver': ^0.1.1-rc.2
  '@deepseek-ai/dsh-llm': ^0.1.1-rc.2
  '@deepseek-ai/dsh-session': ^0.1.1-rc.2
  '@deepseek-ai/dsh-subprocess': ^0.1.1-rc.2
  '@deepseek-ai/dsh-tools': ^0.1.1-rc.2
  '@deepseek-ai/schemastery': ^3.18.1

  '@types/node': ^24.0.0
  '@types/react': ~18.3.1
  '@types/react-dom': ^18.3.5
  esbuild: ^0.25.0
  react: ^18.3.1
  react-dom: ^18.3.1
  typescript: ^5.8.0
